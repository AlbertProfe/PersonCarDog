<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java Stack Pyramid – From Hardware to Spring Boot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 16px 60px;
      color: #334155;
    }

    h1 {
      font-size: 1.7rem;
      font-weight: 700;
      margin-bottom: 6px;
      text-align: center;
      color: #1e293b;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 28px;
      text-align: center;
    }

    /* ===== PYRAMID ===== */
    .pyramid {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }

    .layer {
      height: 52px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.95rem;
      color: #f8fafc;
      opacity: 0.28;
      transform: scale(0.97);
      transition: all 0.45s ease;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .layer.active {
      opacity: 1;
      transform: scale(1);
    }

    .layer-7 { width: 28%; background: linear-gradient(135deg, #22c55e, #16a34a); }
    .layer-6 { width: 40%; background: linear-gradient(135deg, #14b8a6, #0d9488); }
    .layer-5 { width: 52%; background: linear-gradient(135deg, #0ea5e9, #0284c7); }
    .layer-4 { width: 64%; background: linear-gradient(135deg, #3b82f6, #2563eb); }
    .layer-3 { width: 76%; background: linear-gradient(135deg, #6366f1, #4f46e5); }
    .layer-2 { width: 88%; background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
    .layer-1 { width: 100%; background: linear-gradient(135deg, #64748b, #475569); }

    /* ===== CONTROLS ===== */
    .controls {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-start {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #f8fafc;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }
    .btn-start:hover {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      transform: translateY(-1px);
    }
    .btn-start:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-advance {
      background: linear-gradient(135deg, #14b8a6, #0d9488);
      color: #f8fafc;
      box-shadow: 0 4px 14px rgba(13, 148, 136, 0.3);
    }
    .btn-advance:hover {
      background: linear-gradient(135deg, #0d9488, #0f766e);
      transform: translateY(-1px);
    }
    .btn-advance:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-reset {
      background: #f8fafc;
      color: #475569;
      border: 1.5px solid #cbd5e1;
    }
    .btn-reset:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }

    .status {
      margin-top: 14px;
      font-size: 0.9rem;
      color: #64748b;
      min-height: 22px;
      text-align: center;
      font-weight: 500;
    }
    .status.done { color: #475569; }

    /* ===== INFO CARDS – newest on top ===== */
    .info-section {
      width: 100%;
      max-width: 720px;
      margin-top: 28px;
      display: flex;
      flex-direction: column;
    }

    .info-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(148, 163, 184, 0.12);
      opacity: 0;
      transform: translateY(-12px);
      transition: all 0.5s ease;
      display: none;
    }

    .info-card.visible {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .info-card.current {
      border-color: #94a3b8;
      box-shadow: 0 4px 16px rgba(100, 116, 139, 0.18);
    }

    .info-card h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .info-card h3 .badge {
      font-size: 0.68rem;
      font-weight: 600;
      background: #e2e8f0;
      color: #475569;
      padding: 3px 9px;
      border-radius: 20px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 22px;
    }

    .info-item {
      font-size: 0.86rem;
      line-height: 1.5;
    }

    .info-item strong {
      display: block;
      color: #334155;
      font-weight: 600;
      margin-bottom: 2px;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .info-item p { color: #64748b; }
    .info-item.full { grid-column: 1 / -1; }

    .note {
      margin-top: 24px;
      font-size: 0.82rem;
      color: #94a3b8;
      text-align: center;
      max-width: 580px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .layer { font-size: 0.82rem; height: 46px; }
      .info-grid { grid-template-columns: 1fr; }
      h1 { font-size: 1.35rem; }
      .controls { flex-direction: column; }
    }
  </style>
</head>
<body>

  <h1>Java Technology Stack</h1>
  <p class="subtitle">Pyramid of layers – from Hardware up to Spring Boot</p>

  <div class="pyramid" id="pyramid">
    <div class="layer layer-7" id="layer7"><span>Spring Boot</span></div>
    <div class="layer layer-6" id="layer6"><span>Spring</span></div>
    <div class="layer layer-5" id="layer5"><span>Maven</span></div>
    <div class="layer layer-4" id="layer4"><span>Java SE</span></div>
    <div class="layer layer-3" id="layer3"><span>JVM</span></div>
    <div class="layer layer-2" id="layer2"><span>Operating System</span></div>
    <div class="layer layer-1" id="layer1"><span>Hardware</span></div>
  </div>

  <div class="controls">
    <button class="btn btn-start" id="startBtn" onclick="startStack()">▶ Start Auto (10s)</button>
    <button class="btn btn-advance" id="advanceBtn" onclick="advanceStep()" disabled>Next →</button>
    <button class="btn btn-reset" id="resetBtn" onclick="resetStack()">Reset</button>
  </div>

  <div class="status" id="status">Click “Start Auto” or use “Next” to advance manually</div>

  <!-- Cards container – newest inserted at top -->
  <div class="info-section" id="infoSection"></div>

  <p class="note">
    Each layer depends on the ones below it.<br>
    Spring Boot → Spring → Maven → Java SE → JVM → OS → Hardware
  </p>

  <script>
    const STEPS = [
      {
        layer: 'layer1',
        title: 'Hardware',
        badge: 'Base Layer',
        status: '① Hardware — the physical foundation',
        html: `
          <div class="info-grid">
            <div class="info-item"><strong>What it is</strong><p>The physical computer: CPU, RAM, disk, network card. Everything above ultimately runs on this silicon.</p></div>
            <div class="info-item"><strong>Why it matters</strong><p>Without hardware there is nothing. All higher layers are software abstractions that use the hardware’s resources.</p></div>
            <div class="info-item full"><strong>Relation</strong><p>The Operating System sits directly on top of the hardware and controls it.</p></div>
          </div>`
      },
      {
        layer: 'layer2',
        title: 'Operating System',
        badge: 'OS',
        status: '② Operating System — manages the hardware',
        html: `
          <div class="info-grid">
            <div class="info-item"><strong>What it is</strong><p>Windows, Linux, macOS… The software that manages hardware resources, processes, memory and files.</p></div>
            <div class="info-item"><strong>Why it matters</strong><p>It provides a stable platform so programs don’t have to talk to hardware directly.</p></div>
            <div class="info-item full"><strong>Relation</strong><p>The JVM runs as a process on top of the Operating System.</p></div>
          </div>`
      },
      {
        layer: 'layer3',
        title: 'JVM',
        badge: 'Java Virtual Machine',
        status: '③ JVM — runs Java bytecode',
        html: `
          <div class="info-grid">
            <div class="info-item"><strong>What it is</strong><p>The engine that executes Java bytecode. It provides memory management (GC), security and platform independence.</p></div>
            <div class="info-item"><strong>Why it matters</strong><p>“Write once, run anywhere.” The same .class files run on any OS that has a JVM.</p></div>
            <div class="info-item full"><strong>Relation</strong><p>Java SE (the language + standard libraries) runs on top of the JVM.</p></div>
          </div>`
      },
      {
        layer: 'layer4',
        title: 'Java SE',
        badge: 'Standard Edition',
        status: '④ Java SE — the language & standard libraries',
        html: `
          <div class="info-grid">
            <div class="info-item"><strong>What it is</strong><p>The core Java language + standard libraries (collections, I/O, concurrency, etc.).</p></div>
            <div class="info-item"><strong>Why it matters</strong><p>This is the foundation every Java developer must master before using any framework.</p></div>
            <div class="info-item full"><strong>Relation</strong><p>Maven is a tool that builds and manages projects written in Java SE.</p></div>
          </div>`
      },
      {
        layer: 'layer5',
        title: 'Maven',
        badge: 'Build Tool',
        status: '⑤ Maven — build & dependency management',
        html: `
          <div class="info-grid">
            <div class="info-item"><strong>What it is</strong><p>A build and dependency management tool. You describe the project in pom.xml; Maven downloads libraries, compiles, tests and packages.</p></div>
            <div class="info-item"><strong>Why it matters</strong><p>Almost every professional Java project uses Maven (or Gradle). It standardises project structure and solves dependency management.</p></div>
            <div class="info-item full"><strong>Relation</strong><p>Spring projects are normally built and managed with Maven.</p></div>
          </div>`
      },
      {
        layer: 'layer6',
        title: 'Spring',
        badge: 'Framework',
        status: '⑥ Spring — the powerful application framework',
        html: `
          <div class="info-grid">
            <div class="info-item"><strong>What it is</strong><p>A powerful application framework that provides Dependency Injection, AOP, data access, web MVC and much more.</p></div>
            <div class="info-item"><strong>Why it matters</strong><p>It is the most widely used framework in the Java enterprise world.</p></div>
            <div class="info-item full"><strong>Relation</strong><p>Spring Boot is built on top of the Spring Framework and makes it dramatically easier to use.</p></div>
          </div>`
      },
      {
        layer: 'layer7',
        title: 'Spring Boot',
        badge: 'Top Layer',
        status: '⑦ Spring Boot — the top, production-ready layer',
        html: `
          <div class="info-grid">
            <div class="info-item"><strong>What it is</strong><p>An opinionated layer on top of Spring. It adds auto-configuration, starters, embedded servers and production-ready features.</p></div>
            <div class="info-item"><strong>Why it matters</strong><p>It is the fastest and most common way to build modern Java applications (APIs, microservices, web apps).</p></div>
            <div class="info-item full"><strong>Relation</strong><p>Spring Boot sits at the very top of this stack. It rests on Spring, which rests on Maven / Java SE / JVM / OS / Hardware.</p></div>
          </div>`
      }
    ];

    let currentStep = -1;
    let autoTimer = null;

    function showStep(index) {
      if (index < 0 || index >= STEPS.length) return;

      const step = STEPS[index];
      currentStep = index;

      // Activate layer
      document.getElementById(step.layer).classList.add('active');

      // Create card and insert at TOP
      const section = document.getElementById('infoSection');
      section.querySelectorAll('.info-card').forEach(c => c.classList.remove('current'));

      const card = document.createElement('div');
      card.className = 'info-card visible current';
      card.innerHTML = `<h3>${step.title} <span class="badge">${step.badge}</span></h3>${step.html}`;
      section.insertBefore(card, section.firstChild);

      document.getElementById('status').textContent = step.status;
      document.getElementById('status').classList.toggle('done', index === STEPS.length - 1);

      document.getElementById('advanceBtn').disabled = index >= STEPS.length - 1;
      document.getElementById('startBtn').disabled = true;

      if (index === STEPS.length - 1) {
        stopAuto();
        document.getElementById('status').textContent = '✓ Stack complete — Spring Boot rests on everything below';
      }
    }

    function advanceStep() {
      if (currentStep >= STEPS.length - 1) return;
      showStep(currentStep + 1);
    }

    function startStack() {
      resetStack(false);
      document.getElementById('startBtn').disabled = true;
      document.getElementById('advanceBtn').disabled = false;

      // First step immediately
      showStep(0);

      // Then every 10 seconds
      autoTimer = setInterval(() => {
        if (currentStep < STEPS.length - 1) {
          showStep(currentStep + 1);
        } else {
          stopAuto();
        }
      }, 10000);
    }

    function stopAuto() {
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
      }
    }

    function resetStack(clearStatus = true) {
      stopAuto();
      currentStep = -1;

      for (let i = 1; i <= 7; i++) {
        document.getElementById('layer' + i).classList.remove('active');
      }
      document.getElementById('infoSection').innerHTML = '';

      document.getElementById('startBtn').disabled = false;
      document.getElementById('advanceBtn').disabled = true;

      if (clearStatus) {
        document.getElementById('status').textContent = 'Click “Start Auto” or use “Next” to advance manually';
        document.getElementById('status').classList.remove('done');
      }
    }
  </script>

</body>
</html>
