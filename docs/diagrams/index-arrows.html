<!-- ============== PURE SVG ARROWS (no JS) ============== -->
<svg class="overlay" id="overlay"
     xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1280 1400"
     preserveAspectRatio="none">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b3a6b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/>
    </marker>
  </defs>

  <!-- ─── TOP ROW: App → Controller (step 1) ─── -->
  <path d="M 300 130 L 360 130"
        stroke="#1b3a6b" stroke-width="2.5" fill="none"
        marker-end="url(#arrow)"/>

  <!-- ─── TOP ROW: Controller → Service (step 3) ─── -->
  <path d="M 620 130 L 680 130"
        stroke="#1b3a6b" stroke-width="2.5" fill="none"
        marker-end="url(#arrow)"/>

  <!-- ─── TOP ROW: Service → Repository (step 6, green: addCarTransaction) ─── -->
  <path d="M 940 130 L 1000 130"
        stroke="#2f9e44" stroke-width="2.5" fill="none"
        marker-end="url(#arrow-green)"/>

  <!-- ─── Controller → Utils (menu loop, curved down-left) ─── -->
  <path d="M 450 320
           C 450 420, 260 420, 260 520"
        stroke="#1b3a6b" stroke-width="2" fill="none"
        marker-end="url(#arrow)" stroke-dasharray="6 4"/>

  <!-- ─── Controller → Person (a.setCar / b.setCar) ─── -->
  <path d="M 560 320
           C 560 430, 640 430, 640 520"
        stroke="#1b3a6b" stroke-width="2" fill="none"
        marker-end="url(#arrow)" stroke-dasharray="6 4"/>

  <!-- ─── Service → CarTransaction (new CarTransaction) ─── -->
  <path d="M 900 320
           C 900 430, 940 430, 940 520"
        stroke="#1b3a6b" stroke-width="2" fill="none"
        marker-end="url(#arrow)" stroke-dasharray="6 4"/>

  <!-- ─── Service ↔ Person (buyer.setCar / seller.setCar — green) ─── -->
  <path d="M 780 260
           C 720 380, 700 460, 660 540"
        stroke="#2f9e44" stroke-width="2" fill="none"
        marker-end="url(#arrow-green)"/>

  <!-- ─── Repository → legend repo block (data stored) ─── -->
  <path d="M 1080 320
           C 1120 480, 1120 620, 1080 720"
        stroke="#1b3a6b" stroke-width="2" fill="none"
        marker-end="url(#arrow)" stroke-dasharray="6 4"/>
</svg>
